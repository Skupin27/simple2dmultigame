<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tag It</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Nickname Modal -->
  <div id="nicknameModal" class="modal">
    <div class="modal-card">
      <h1>tag·it</h1>
      <p>enter your runner name</p>
      <input type="text" id="nicknameInput" maxlength="14" placeholder="speedy fox" autocomplete="off">
      <button id="joinGameBtn">join arena</button>
      <p class="hint">hold <kbd>shift</kbd> to sprint · tag the IT player</p>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="gameHud" class="game-hud hidden">
    <div class="it-status" id="itDisplay">IT: —</div>
    <div class="sprint-hint"><span>sprint</span><kbd>⇧</kbd></div>
  </div>

  <!-- Toast messages -->
  <div id="toastMsg" class="toast hidden"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" width="1100" height="750"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
